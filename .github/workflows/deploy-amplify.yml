name: Deploy Amplify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amplify-moba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
      AMPLIFY_BRANCH: main
      VITE_API_BASE_URL: https://api.xbotone.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build
        run: |
          npm ci || npm install
          npm run build

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package dist
        run: |
          cd dist
          zip -r ../moba-dist.zip .

      - name: Create Amplify deployment
        id: create
        run: |
          OUT=$(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --output json)
          echo "$OUT" > /tmp/create.json
          echo "job_id=$(python3 -c "import json; print(json.load(open('/tmp/create.json'))['jobId'])")" >> "$GITHUB_OUTPUT"
          echo "upload_url=$(python3 -c "import json; print(json.load(open('/tmp/create.json'))['zipUploadUrl'])")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        run: |
          curl -sS -f -H "Content-Type: application/zip" \
            --upload-file moba-dist.zip \
            "${{ steps.create.outputs.upload_url }}"

      - name: Start deployment
        run: |
          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-id "${{ steps.create.outputs.job_id }}"
          echo "Deployed job ${{ steps.create.outputs.job_id }}"
          echo "https://moba.xbotone.com"
