version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci || npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Strict-Transport-Security'
          value: 'max-age=31536000; includeSubDomains'
        - key: 'Content-Security-Policy'
          value: "frame-ancestors 'self' https://xbotone.com https://www.xbotone.com http://localhost:3000 http://127.0.0.1:3000"
    - pattern: '/index.html'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache'
# Rewrites: public/amplify-rewrites.json
#   /share/<*> → API …/v1/public/moba/share/<*> (200 proxy, WhatsApp/OG)
#   /<*> → /index.html (404-200 SPA)
# Aplique via `aws amplify update-app --custom-rules` ou Amplify Console
# (Hosting → Rewrites and redirects). A regra /share deve vir antes do catch-all.
